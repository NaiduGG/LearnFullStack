<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        font-family: Arial, sans-serif;
        font-size: 14px;
      }
      .div {
        display: flex;
        justify-content: space-around;
        align-items: center;
        padding: 10px;
        margin-top: 20px;
      }

      a {
        text-decoration: none;
        display: inline-block; /* 👈 Added this to make width work */
        width: 50px;
        text-align: center; /* 👈 Optional: Centers the text inside the button */
        color: rgb(255, 255, 255);
        background-color: rgb(69, 69, 200);
        padding: 7px 16px;
        border-radius: 5px;
      }

      .add-periods {
        display: flex;
        flex-direction: row;
        justify-content: space-around;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <div class="div">
      <a href="testing.html">Next</a>
      <a href="sign-in.html">log out</a>
    </div>
    <form action="/add-teacher" method="POST" class="add-periods">
      <label
        >Name:
        <input
          type="text"
          id="teacher-name"
          name="name"
          placeholder="H. Appalanaidu"
          required
        />
      </label>
      <label
        >Department:
        <input
          type="text"
          id="teacher-department"
          name="department"
          placeholder="DTSC"
          required
        />
      </label>
      <label
        >Nickname:
        <input
          type="text"
          id="teacher-nickname"
          name="nickname"
          placeholder="HAN"
          required
        />

        <button type="submit">Enter</button>
      </label>
    </form>
  </body>
  <script src="makeTable.js"></script>
</html>
